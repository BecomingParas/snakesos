version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: snake_rescue_postgres
    environment:
      POSTGRES_DB: snake_rescue
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # Using port 5433 on host to avoid conflict with npl19
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d snake_rescue"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: snake_rescue_redis
    ports:
      - "6380:6379"   # Using port 6380 on host to avoid conflict with npl19
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
