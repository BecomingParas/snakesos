# ===================================================================
# GRAPHQL CODE GENERATOR CONFIGURATION
# ===================================================================
# Generates TypeScript types from GraphQL schema
# https://the-guild.dev/graphql/codegen
# ===================================================================

schema: './src/lib/graphql/**/*.graphql'

config:
  # Global configuration
  allowPartialOutputs: true
  enumsAsTypes: true
  futureProofEnums: true
  futureProofUnions: true
  nonOptionalTypename: false
  skipTypename: false
  namingConvention:
    typeNames: pascal-case#pascalCase
    enumValues: keep
    transformUnderscore: true

generates:
  # ===================================================================
  # BACKEND - Resolver Types
  # ===================================================================
  ./src/generated/resolvers-types.ts:
    plugins:
      - typescript
      - typescript-resolvers
    config:
      useIndexSignature: true
      contextType: '../context/index.js#GraphQLContext'
      mappers:
        User: '@snake-rescue/database#User as UserModel'
        RescueRequest: '@snake-rescue/database#RescueRequest as RescueRequestModel'
        RescueTimeline: '@snake-rescue/database#RescueTimeline as RescueTimelineModel'
        Volunteer: '@snake-rescue/database#Volunteer as VolunteerModel'
        SnakeSpecies: '@snake-rescue/database#SnakeSpecies as SnakeSpeciesModel'
        AIIdentification: '@snake-rescue/database#AIIdentification as AIIdentificationModel'
        BlogPost: '@snake-rescue/database#BlogPost as BlogPostModel'
        GalleryImage: '@snake-rescue/database#GalleryImage as GalleryImageModel'
        Donation: '@snake-rescue/database#Donation as DonationModel'
        Notification: '@snake-rescue/database#Notification as NotificationModel'
        ContactMessage: '@snake-rescue/database#ContactMessage as ContactMessageModel'
        ActivityLog: '@snake-rescue/database#ActivityLog as ActivityLogModel'
        Training: '@snake-rescue/database#Training as TrainingModel'
      scalars:
        DateTime: Date
        JSON: any
        Email: string
        Phone: string
        Latitude: number
        Longitude: number
        PositiveInt: number
        Upload: File

  # ===================================================================
  # FRONTEND - Apollo Client Types & Hooks
  # ===================================================================
  ./src/generated/graphql-operations.ts:
    documents: 
      - '../../libs/frontend/features/src/**/*.graphql'
      - '../../apps/frontend/src/**/*.graphql'
      - './src/lib/graphql/**/fragments.graphql'
      - './src/lib/graphql/**/mutations.graphql'
      - './src/lib/graphql/**/queries.graphql'
      - './src/lib/graphql/**/subscriptions.graphql'
      - '!./src/lib/graphql/**/*-schema.graphql'
      - '!./src/lib/graphql/**/schema.graphql'
      - '!./src/lib/graphql/**/inputs.graphql'
      - '!./src/lib/graphql/**/enums.graphql'
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-apollo
    config:
      skipTypename: false
      dedupeFragments: true
      preResolveTypes: false
      withHooks: true
      withComponent: false
      withHOC: false
      namingConvention:
        typeNames: pascal-case#pascalCase
        enumValues: keep
      scalars:
        DateTime: string
        JSON: any
        Email: string
        Phone: string
        Latitude: number
        Longitude: number
        PositiveInt: number
        Upload: File

  # ===================================================================
  # FRAGMENT MATCHERS
  # ===================================================================
  ./src/generated/fragment-matcher.ts:
    plugins:
      - fragment-matcher

  # ===================================================================
  # INTROSPECTION SCHEMA (for tooling)
  # ===================================================================
  ./src/generated/schema.json:
    plugins:
      - introspection

  # ===================================================================
  # SCHEMA SDL (for documentation)
  # ===================================================================
  ./src/generated/schema.graphql:
    plugins:
      - schema-ast

hooks:
  afterAllFileWrite:
    - prettier --write
