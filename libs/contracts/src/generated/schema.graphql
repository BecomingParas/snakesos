type Mutation {
  _empty: String

  """
  Volunteer accepts rescue assignment
  """
  acceptRescue(input: AcceptRescueInput!): RescueRequest!

  """
  Add timeline event to rescue
  """
  addRescueTimelineEvent(input: AddTimelineEventInput!): RescueTimeline!

  """
  Apply to become a volunteer
  """
  applyVolunteer(input: ApplyVolunteerInput!): Volunteer!

  """
  Archive a blog post
  """
  archiveBlogPost(id: ID!): BlogPost!

  """
  Archive contact message
  """
  archiveContactMessage(messageId: ID!): ContactMessage!

  """
  Assign rescue to volunteer (admin/coordinator)
  """
  assignRescue(input: AssignRescueInput!): RescueRequest!

  """
  Bulk approve volunteers
  """
  bulkApproveVolunteers(volunteerIds: [ID!]!): BulkOperationResult!

  """
  Bulk assign rescues to volunteer
  """
  bulkAssignRescues(rescueIds: [ID!]!, volunteerId: ID!): BulkOperationResult!

  """
  Bulk delete gallery images
  """
  bulkDeleteGalleryImages(ids: [ID!]!): BulkOperationResult!

  """
  Bulk import snake species
  """
  bulkImportSnakeSpecies(
    species: [CreateSnakeSpeciesInput!]!
  ): BulkOperationResult!

  """
