"""
enum VenomType {
  CYTOTOXIC
  HEMOTOXIC
  MIXED
  NEUROTOXIC
}

"""
Input for email verification using OTP code only
"""
input VerifyEmailInput {
  code: String!
  email: Email!
}

"""
Volunteer profile and information
"""
type Volunteer {
  address: String!
  assignedZone: String
  availableDays: [String!]!
  availableTime: AvailabilityTime!
  averageRescueTime: Int
  averageResponseTime: Int
  bio: String
  cancelledRescues: Int!
  certificationExpiry: DateTime
  certifications: [String!]!
  completedRescues: Int!
  contact: Phone!
  coverageRadius: Int!
  createdAt: DateTime!
  currentLat: Latitude
  currentLng: Longitude
  dateOfBirth: DateTime
  email: Email
  emergencyAvailability: Boolean!
  emergencyContact: String
  emergencyPhone: Phone
  equipment: [String!]!
  experience: ExperienceLevel!
  experienceYears: Int
  gender: String
  hasEquipment: Boolean!
  id: ID!
  imageUrl: String
  isAvailableNow: Boolean!
  languages: [String!]!
  lastLocationUpdate: DateTime
  municipality: String!
  name: String!
  rating: Float
  rejectedAt: DateTime
  rejectedBy: User
  rejectionReason: String
  rescueAssignments(
    filter: RescueRequestFilterInput
    pagination: PaginationInput
  ): RescueRequestConnection!
  skills: [String!]!
  status: VolunteerStatus!
  successRate: Float
  totalRatings: Int!
  totalRescues: Int!
  trainingCompleted: Boolean!
  trainingDate: DateTime
  trainings(pagination: PaginationInput): TrainingConnection!
  updatedAt: DateTime!
  user: User
  vehicle: VehicleType!
  vehicleDetails: String
  verifiedAt: DateTime
  verifiedBy: User
  ward: Int
}

"""
Volunteer analytics
"""
type VolunteerAnalytics {
  activeCount: Int!
  averageRating: Float!
  byExperience: [VolunteerByExperience!]!
  byMunicipality: [VolunteerByMunicipality!]!
  byStatus: [VolunteerByStatus!]!
  timeSeriesData: [TimeSeriesPoint!]!
  topPerformers: [VolunteerPerformance!]!
  totalVolunteers: Int!
}

"""
Input for volunteer analytics
"""
input VolunteerAnalyticsInput {
  dateRange: AnalyticsDateRangeInput
  experience: ExperienceLevel
  municipality: String
  status: VolunteerStatus
}

"""
Volunteer availability change event
"""
type VolunteerAvailabilityEvent {
  changedAt: DateTime!
  currentLat: Latitude
  currentLng: Longitude
  isAvailableNow: Boolean!
  volunteer: Volunteer!
}

"""
Volunteer count by experience
"""
type VolunteerByExperience {
  count: Int!
  experience: ExperienceLevel!
  percentage: Float!
}

"""
Volunteer count by municipality
"""
type VolunteerByMunicipality {
  count: Int!
  municipality: String!
  percentage: Float!
}

"""
Volunteer count by status
"""
type VolunteerByStatus {
  count: Int!
  percentage: Float!
  status: VolunteerStatus!
}

"""
Connection type for paginated volunteer results
"""
type VolunteerConnection {
  edges: [VolunteerEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""
Edge type for volunteer connection
"""
type VolunteerEdge {
  cursor: String!
  node: Volunteer!
}

"""
Volunteer statistics by experience
"""
type VolunteerExperienceStats {
  count: Int!
  experience: ExperienceLevel!
}

"""
Filter input for volunteer queries
"""
input VolunteerFilterInput {
  emergencyAvailability: Boolean
  experience: ExperienceLevel
  hasEquipment: Boolean
  hasVehicle: Boolean
  isAvailableNow: Boolean
  minRating: Float
  minSuccessRate: Float
  municipalities: [String!]
  municipality: String
  search: String
  status: VolunteerStatus
  statuses: [VolunteerStatus!]
}

"""
Volunteer statistics by municipality
"""
type VolunteerMunicipalityStats {
  activeCount: Int!
  count: Int!
  municipality: String!
}

"""
Volunteer performance metrics
"""
type VolunteerPerformance {
  averageResponseTime: Int!
  rating: Float!
  rescuesCompleted: Int!
  successRate: Float!
  volunteer: Volunteer!
}

"""
Fields available for sorting volunteers
"""
enum VolunteerSortField {
  CREATED_AT
  MUNICIPALITY
  NAME
  RATING
  SUCCESS_RATE
  TOTAL_RESCUES
}

"""
Sort input for volunteer queries
"""
input VolunteerSortInput {
  field: VolunteerSortField!
  order: SortOrder!
}

"""
Volunteer statistics
"""
type VolunteerStats {
  active: Int!
  byExperience: [VolunteerExperienceStats!]!
  byMunicipality: [VolunteerMunicipalityStats!]!
  pending: Int!
  suspended: Int!
  topPerformers: [VolunteerPerformance!]!
  total: Int!
  verified: Int!
}

"""
Status of volunteer application/account
"""
enum VolunteerStatus {
  APPROVED
  INACTIVE
  PENDING
  REJECTED
  SUSPENDED
  VERIFIED
}

"""
Volunteer status change event
"""
type VolunteerStatusChangeEvent {
  changedAt: DateTime!
  changedBy: User
  newStatus: VolunteerStatus!
  oldStatus: VolunteerStatus!
  reason: String
  volunteer: Volunteer!
  volunteerId: ID!
}
