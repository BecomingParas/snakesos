# ===================================================================
# CONTACT - TYPE DEFINITIONS
# ===================================================================

"""
Contact message from users
"""
type ContactMessage {
  id: ID!
  
  # Sender
  name: String!
  email: Email!
  phone: Phone
  subject: String!
  message: String!
  
  # Classification
  category: MessageCategory!
  priority: MessagePriority!
  
  # Status
  status: MessageStatus!
  assignedTo: User
  
  # Response
  responded: Boolean!
  respondedAt: DateTime
  response: String
  
  # Metadata
  ipAddress: String
  userAgent: String
  source: String!
  
  createdAt: DateTime!
  updatedAt: DateTime!
}

type EmergencyContact {
  id: ID!
  name: String!
  phone: Phone!
  relationship: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
Contact message statistics
"""
type ContactMessageStats {
  total: Int!
  newMessages: Int!
  respondedMessages: Int!
  byCategory: [MessageByCategory!]!
  byPriority: [MessageByPriority!]!
  averageResponseTime: Int!
  recentMessages: [ContactMessage!]!
}

"""
Message count by category
"""
type MessageByCategory {
  category: MessageCategory!
  count: Int!
  newCount: Int!
}

"""
Message count by priority
"""
type MessageByPriority {
  priority: MessagePriority!
  count: Int!
}
