# ===================================================================
# PAYMENT - TYPE DEFINITIONS
# ===================================================================

"""
Stripe connection status for development testing
"""
type StripeConnectionStatus {
  """Whether Stripe is successfully connected"""
  connected: Boolean!
  
  """Stripe mode: test, live, or unknown"""
  mode: String!
  
  """Stripe account ID (if connected)"""
  accountId: String
  
  """Whether Stripe is in live mode"""
  livemode: Boolean!
  
  """Human-readable status message"""
  message: String!
}

"""
Donation transaction
"""
type Donation {
  id: ID!
  
  # Donor Information
  donor: User
  donorName: String!
  donorEmail: Email
  donorPhone: Phone
  
  # Amount
  amount: Float!
  currency: String!
  amountUSD: Float
  
  # Payment Details
  paymentMethod: PaymentMethod!
  paymentGateway: String!
  transactionId: String
  gatewayResponse: JSON
  
  # Status
  status: PaymentStatus!
  paidAt: DateTime
  
  # Purpose
  purpose: DonationPurpose
  campaign: String
  message: String
  anonymous: Boolean!
  
  # Receipt
  receiptNumber: String
  receiptUrl: String
  invoiceUrl: String
  
  # Verification
  verifiedAt: DateTime
  verifiedBy: User
  verificationNotes: String
  
  # Refund
  refundedAt: DateTime
  refundReason: String
  refundAmount: Float
  
  # Metadata
  ipAddress: String
  userAgent: String
  source: String!
  
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PaymentIntent {
  id: ID!
  rescueChargeId: ID
  donationId: ID
  provider: String!
  amount: String!
  currency: String!
  status: PaymentIntentStatus!
  providerReference: String
  idempotencyKey: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PaymentIntentCheckout {
  paymentIntent: PaymentIntent!
  providerReference: String!
  checkoutUrl: String
}

type Settlement {
  id: ID!
  rescueChargeId: ID
  rescuerId: ID!
  rescuer: Volunteer
  rescuerName: String!
  citizenName: String!
  grossAmount: String!
  commissionRate: String!
  commissionAmount: String!
  rescuerAmount: String!
  amount: String!
  currency: String!
  status: SettlementStatus!
  eligibleAt: DateTime
  settledAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type Payout {
  id: ID!
  settlementId: ID!
  rescuerId: ID!
  rescuerName: String!
  citizenName: String!
  amount: String!
  currency: String!
  status: PayoutStatus!
  paymentMethod: String
  externalReference: String
  requestedAt: DateTime!
  processedAt: DateTime
  failedAt: DateTime
  failureReason: String
}

type Refund {
  id: ID!
  transactionId: ID!
  amount: String!
  currency: String!
  reason: String
  providerReference: String
  status: PaymentStatus!
  createdAt: DateTime!
  processedAt: DateTime
}

enum SettlementStatus {
  PENDING
  ELIGIBLE
  PROCESSING
  SETTLED
  FAILED
  CANCELLED
}

enum PayoutStatus {
  PENDING
  APPROVED
  PROCESSING
  PAID
  FAILED
  REJECTED
  CANCELLED
}

enum PaymentIntentStatus {
  CREATED
  REQUIRES_ACTION
  AUTHORIZED
  SUCCEEDED
  FAILED
  CANCELLED
}

"""
Donation statistics
"""
type DonationStats {
  totalDonations: Int!
  totalAmount: Float!
  totalAmountUSD: Float!
  averageDonation: Float!
  byMethod: [DonationByMethod!]!
  byPurpose: [DonationByPurpose!]!
  topDonors: [TopDonor!]!
  recentDonations: [Donation!]!
  monthlyTrend: [MonthlyDonationData!]!
}

"""
Donation count by payment method
"""
type DonationByMethod {
  method: PaymentMethod!
  count: Int!
  totalAmount: Float!
}

"""
Donation count by purpose
"""
type DonationByPurpose {
  purpose: DonationPurpose!
  count: Int!
  totalAmount: Float!
}

"""
Top donor information
"""
type TopDonor {
  donor: User
  donorName: String!
  totalDonations: Int!
  totalAmount: Float!
  anonymous: Boolean!
}

"""
Monthly donation trend data
"""
type MonthlyDonationData {
  month: String!
  year: Int!
  count: Int!
  amount: Float!
}

"""
Payment gateway configuration
"""
type PaymentGatewayConfig {
  method: PaymentMethod!
  enabled: Boolean!
  displayName: String!
  description: String
  minAmount: Float
  maxAmount: Float
  currencies: [String!]!
  testMode: Boolean!
}
