        status
        priority
        municipality
        ward
        address
        landmark
        lat
        lng
        snakeDescription
        snakeSize
        snakeColor
        isEmergency
        assignedAt
        acceptedAt
        user {
          id
          name
          phone
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
  }
}

query ActiveRescues(
  $pagination: PaginationInput
) {
  activeRescues(
    pagination: $pagination
  ) {
    edges {
      node {
        id
        referenceNumber
        status
        priority
        municipality
        ward
        address
        lat
        lng
        snakeDescription
        isEmergency
        createdAt
        assignedAt
        acceptedAt
        user {
          id
          name
          phone
        }
        assignedVolunteer {
          id
          name
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    totalCount
  }
}
